<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8dff3">
  <title>오늘의 날씨</title>
  <style>
    :root {
      --ink: #0d2230;
      --ink-soft: rgba(13, 34, 48, .62);
      --white: #fff;
      --glass: rgba(255, 255, 255, .18);
      --glass-strong: rgba(255, 255, 255, .3);
      --glass-line: rgba(255, 255, 255, .68);
      --shadow: 0 28px 90px rgba(21, 46, 62, .18), 0 2px 8px rgba(21, 46, 62, .08);
      --lens-x: 0px;
      --count: 12;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
      background: #b9dded;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .scene-stack, .scene, .scene-shade { position: fixed; inset: 0; }
    .scene-stack { z-index: -4; overflow: hidden; background: #b9dded; }
    .scene {
      background-position: center;
      background-size: cover;
      opacity: 0;
      transform: scale(1.035);
      transition: opacity 1.15s ease, filter 1.15s ease, transform 8s ease;
    }
    .scene.active { opacity: 1; transform: scale(1); }

    body.night .scene { filter: brightness(.42) saturate(.76) hue-rotate(8deg); }
    .scene-shade {
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.08), transparent 38%, rgba(10,34,48,.12));
      transition: background .8s;
    }
    body.dark-ui { --ink: #f8fbff; --ink-soft: rgba(248,251,255,.68); }
    body.dark-ui .scene-shade { background: linear-gradient(180deg, rgba(2,12,22,.16), rgba(2,12,22,.05) 42%, rgba(2,12,22,.38)); }

    .weather-loader {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
      background: linear-gradient(145deg, #eadde1 0%, #e6dcdf 46%, #e2d6db 100%);
      color: #272328; transition: opacity 1s cubic-bezier(.22,.8,.2,1), visibility 1s;
    }
    .weather-loader::before { content: ""; position: absolute; width: 68vmax; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.34), transparent 64%); filter: blur(26px); }
    .weather-loader.is-complete { opacity: 0; visibility: hidden; pointer-events: none; }
    .weather-loader-inner { position: relative; width: min(90vw, 520px); text-align: center; transform: translateY(-1vh); }
    .loader-orb-wrap { position: relative; width: clamp(260px, 44vw, 410px); aspect-ratio: 1; margin: 0 auto 34px; filter: drop-shadow(0 32px 34px rgba(91,57,86,.14)); }
    .loader-canvas { display: block; width: 100%; height: 100%; }
    .loader-title { margin: 0; font-size: clamp(22px, 3vw, 31px); font-weight: 620; letter-spacing: -.04em; }
    .loader-description { margin: 11px auto 0; max-width: 330px; color: rgba(39,35,40,.5); font-size: 13px; line-height: 1.65; }
    .loader-dots::after { content: ""; display: inline-block; width: 1.4em; text-align: left; animation: loaderDots 1.35s steps(4,end) infinite; }
    .loader-retry { display: none; margin: 25px auto 0; padding: 12px 24px; border: 1px solid rgba(39,35,40,.12); border-radius: 999px; background: rgba(255,255,255,.36); backdrop-filter: blur(18px); color: #272328; cursor: pointer; }
    .weather-loader.has-error .loader-retry { display: inline-flex; }
    .weather-loader.has-error .loader-canvas { opacity: .52; filter: grayscale(.35); }
    body.is-loading .page { opacity: 0; transform: translateY(16px) scale(.985); }
    .page { transition: opacity .8s ease .15s, transform .9s cubic-bezier(.22,.8,.2,1) .15s; }
    @keyframes loaderDots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%,100% { content: "..."; } }
    @media (prefers-reduced-motion: reduce) { .loader-dots::after { animation: none !important; } }

    .page { width: 100%; min-height: 100svh; margin: 0; padding: 24px 28px 30px; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 50px; }
    .place-button, .reset-button, .connection {
      border: 0; border-radius: 999px; padding: 10px 15px;
      background: rgba(255,255,255,.16); color: var(--ink); backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }
    .place-button, .reset-button { cursor: pointer; }
    .place-button { font-weight: 680; letter-spacing: -.02em; }
    .topbar { width: min(980px, 100%); margin-inline: auto; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .connection { display: flex; align-items: center; gap: 7px; color: var(--ink-soft); font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #f19e53; box-shadow: 0 0 0 4px rgba(241,158,83,.15); }
    .status-dot.online { background: #3db985; box-shadow: 0 0 0 4px rgba(61,185,133,.14); }

    main { flex: 1; width: 100%; align-self: stretch; display: flex; justify-content: center; align-items: center; padding: 26px 0 20px; }
    .content-column { flex: 0 1 980px; width: min(980px, 100%); min-width: 0; margin: 0; }
    .weather-panel {
      width: 100%; border: 1px solid var(--glass-line); border-radius: 42px;
      background: linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.09));
      backdrop-filter: blur(30px) saturate(1.28); -webkit-backdrop-filter: blur(30px) saturate(1.28);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.76), inset 0 -1px 0 rgba(255,255,255,.2);

      if (scroll) ensureSelectedVisible();
    }

    function ensureSelectedVisible() {
      const viewport = $("#timelineViewport");
      const center = lensPositionFor(state.selectedIndex) + itemWidth() / 2;
      viewport.scrollTo({ left: Math.max(0, center - viewport.clientWidth / 2), behavior: "smooth" });
    }

    function renderSelectedWeather(updateLens = true) {
      const item = state.hours[state.selectedIndex]; if (!item) return;
      $("#selectedTimeText").textContent = item.time;
      $("#dataLabel").textContent = item.sourceType === "observation" || state.dataType === "observation" ? "실제 관측" : "단기예보";
      if (item.pending) {
        $("#mainTemperature").textContent = "--"; $("#conditionIcon").textContent = "···"; $("#conditionName").textContent = "기상청 데이터 연결 중"; $("#feelsLike").textContent = "--°";
        $("#highTemp").textContent = "--°"; $("#lowTemp").textContent = "--°"; $("#umbrellaInsight").textContent = "확인 중"; $("#departInsight").textContent = "--:--"; $("#humidityInsight").textContent = "--%"; $("#windInsight").textContent = "--m/s";
        $("#timelineShell").setAttribute("aria-valuetext", `${item.time}, 데이터 불러오는 중`); return;
      }
      $("#mainTemperature").textContent = Math.round(item.temperature);
      $("#conditionIcon").textContent = symbols[item.condition];
      $("#conditionName").textContent = names[item.condition];
      $("#feelsLike").textContent = `${Math.round(item.temperature - (Number(item.wind) >= 3 ? 2 : 1))}°`;
      const temps = state.hours.map(h => Number(h.temperature));
      $("#highTemp").textContent = `${Math.max(...temps)}°`; $("#lowTemp").textContent = `${Math.min(...temps)}°`;
      $("#umbrellaInsight").textContent = item.rainChance >= 50 ? "필요" : item.rainChance >= 30 ? "챙기면 안심" : "불필요";
      $("#departInsight").textContent = findBestDeparture(); $("#humidityInsight").textContent = `${item.humidity}%`; $("#windInsight").textContent = `${item.wind}m/s`;
      $("#timelineShell").setAttribute("aria-valuetext", `${item.time}, ${item.temperature}도, ${names[item.condition]}`);
      syncScene(item);
    }

    function syncScene(item) {
      const sceneName = item.condition === "rain" || item.condition === "shower" ? "rainy" : item.condition === "cloudy" || item.condition === "snow" ? "cloudy" : "sunny";
      document.querySelectorAll(".scene").forEach(scene => scene.classList.toggle("active", scene.dataset.scene === sceneName));
      const night = item.hour >= 20 || item.hour < 6;
      document.body.classList.toggle("night", night); document.body.classList.toggle("dark-ui", night || sceneName === "rainy");
    }

    function findBestDeparture() { const best = state.hours.slice(state.selectedIndex).reduce((a,b) => a.rainChance <= b.rainChance ? a : b); return best.time; }

    function bindLiquidDrag() {
      const shell = $("#timelineShell"); let startX = 0, lastX = 0, lastT = 0;
      const localX = event => event.clientX - shell.getBoundingClientRect().left - itemWidth() / 2;
      shell.addEventListener("pointerdown", event => {
        if (event.button !== undefined && event.button !== 0) return;
        state.dragging = true; shell.classList.add("dragging"); shell.setPointerCapture(event.pointerId);
        startX = lastX = event.clientX; lastT = performance.now(); moveLens(localX(event), true, 0);
      });
      shell.addEventListener("pointermove", event => {
        if (!state.dragging) return; const now = performance.now(); const velocity = (event.clientX - lastX) / Math.max(1, now - lastT) * 16;
        moveLens(localX(event), true, velocity); lastX = event.clientX; lastT = now;
      });
      const end = event => {
        if (!state.dragging) return; state.dragging = false; shell.classList.remove("dragging"); shell.style.setProperty("--stretch", "0px");
        try { shell.releasePointerCapture(event.pointerId); } catch {}
        selectHour(Math.round(state.lensX / itemWidth()));
      };
      shell.addEventListener("pointerup", end); shell.addEventListener("pointercancel", end);
      shell.addEventListener("keydown", event => {
        if (event.key === "ArrowRight") { event.preventDefault(); selectHour(state.selectedIndex + 1); }
        if (event.key === "ArrowLeft") { event.preventDefault(); selectHour(state.selectedIndex - 1); }
        if (event.key === "Home") { event.preventDefault(); selectHour(0); }
        if (event.key === "End") { event.preventDefault(); selectHour(state.hours.length - 1); }
      });
    }

    function setContext(location, dateLabel = "오늘", dataType = "forecast") {
      state.location = location || "서울"; state.dateLabel = dateLabel; state.dataType = dataType; state.hours = pendingWeather(); state.selectedIndex = dateLabel === "오늘" ? new Date().getHours() : 0;
      $("#topLocation").textContent = state.location; $("#locationTitle").textContent = state.location; $("#dateLabel").textContent = state.dateLabel;
      $("#timeRange").max = state.hours.length - 1; $("#timelineShell").setAttribute("aria-valuemax", state.hours.length - 1); renderTimeline();
    }

    async function connectAgent() {
      if (!TOKEN_ENDPOINT || TOKEN_ENDPOINT.includes("YOUR-")) { setConnection(false, "연결 설정 필요"); return; }
      setConnection(false, "Connecting");
      try {
        const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 12000);
        const response = await fetch(TOKEN_ENDPOINT, { method: "POST", headers: { "Accept": "application/json" }, signal: controller.signal }); clearTimeout(timeout);
        if (!response.ok) { const detail = await response.text(); throw new Error(`token endpoint ${response.status}: ${detail.slice(0, 180)}`); }
        const payload = await response.json(); const token = payload.token || payload.directLineToken || payload;
        if (!token || typeof token !== "string") throw new Error("token missing");
        if (!payload.userId || !String(payload.userId).startsWith("dl_")) throw new Error("Direct Line userId missing");
        state.userId = payload.userId;
        state.subscription?.unsubscribe?.();
        state.directLine = window.WebChat.createDirectLine({ token });
        state.subscription = state.directLine.activity$.subscribe({
          next: activity => { const isBot = activity.from?.role === "bot" || (activity.from?.id && activity.from.id !== state.userId); if (activity.type === "message" && isBot) receiveAgentActivity(activity); },
          error: error => { console.warn("Direct Line stream error", error); setConnection(false, "Offline"); $("#sendButton").disabled = false; }
        });
        setConnection(true, "Online");
      } catch (error) { console.warn("Direct Line 연결 실패", error); setConnection(false, "Offline"); }
    }
    function setConnection(online, label) { state.connected = online; $("#statusDot").classList.toggle("online", online); $("#connectionLabel").textContent = label; }
    function completeLoading() {
      clearTimeout(state.loadingTimer); state.loadingTimer = null;
      cancelAnimationFrame(loaderAnimationFrame);
      const loader = $("#weatherLoader"); loader.classList.remove("has-error"); loader.classList.add("is-complete"); document.body.classList.remove("is-loading");
      setTimeout(() => { loader.hidden = true; }, 1000);
    }
    function showLoadingError(message) {
      clearTimeout(state.loadingTimer); state.loadingTimer = null;
      cancelAnimationFrame(loaderAnimationFrame);
      const loader = $("#weatherLoader"); loader.hidden = false; loader.classList.remove("is-complete"); loader.classList.add("has-error");
      $("#loaderTitle").textContent = "날씨 정보를 불러오지 못했어요"; $("#loaderDescription").textContent = message || "잠시 후 다시 시도해 주세요.";
    }
    function retryInitialWeather() {
      const loader = $("#weatherLoader"); loader.hidden = false; loader.classList.remove("is-complete", "has-error"); document.body.classList.add("is-loading");
      $("#loaderTitle").innerHTML = `날씨 정보 가져오는 중<span class="loader-dots"></span>`; $("#loaderDescription").textContent = "기상청 관측과 시간별 예보를 확인하고 있어요.";
      startLoaderAnimation();
      setContext("서울", "오늘", "forecast"); state.pendingHour = new Date().getHours(); loadInitialWeather(true); if (!state.connected) connectAgent();
    }

    async function sendPrompt(text) {
      if (state.connected && state.directLine) {
        $("#sendButton").disabled = true;
        const requestedHour = parseRequestedHour(text); if (requestedHour !== null) state.pendingHour = requestedHour;
        try {
          await state.directLine.postActivity({ type: "message", from: { id: getUserId(), name: "날씨 사용자" }, text, locale: "ko-KR", channelData: { clientContext: { location: state.location, dateLabel: state.dateLabel, selectedTime: state.hours[state.selectedIndex]?.time } } }).toPromise();
        } catch (error) {
          console.warn("메시지 전송 실패", error); $("#sendButton").disabled = false; setConnection(false, "Offline"); showReply("메시지를 보내지 못했습니다. 페이지를 새로고침해 다시 연결해 주세요.");
        }
      } else demoReply(text);
    }
    function receiveAgentActivity(activity) { $("#sendButton").disabled = false; const text = activity.text || extractAttachmentText(activity.attachments) || "응답을 받았습니다."; showReply(text); applyAgentContext(text, activity.channelData); }
    function extractAttachmentText(attachments = []) { return attachments.map(a => a.content?.body?.map?.(x => x.text).filter(Boolean).join(" ")).filter(Boolean).join("\n"); }

    function applyAgentContext(text, channelData = {}) {
      const structured = channelData?.weatherUi || parseWeatherUiBlock(text); if (structured) return applyStructuredWeather(structured);
      const tableData = parseForecastTable(text); if (tableData) return applyStructuredWeather(tableData);
      const observation = parseSingleObservation(text); if (observation) return applyStructuredWeather(observation);
      const location = findLocation(text); const dateLabel = /어제|관측자료|실제 관측/.test(text) ? "조회 시각" : /내일/.test(text) ? "내일" : "오늘";
      if (location) { state.location = location; state.dateLabel = dateLabel; $("#topLocation").textContent = location; $("#locationTitle").textContent = location; $("#dateLabel").textContent = dateLabel; }
    }
    function parseWeatherUiBlock(text) { const match = text.match(/```weather-ui\s*([\s\S]*?)```/i); if (!match) return null; try { return JSON.parse(match[1]); } catch { return null; } }
    function parseForecastTable(text) {
      const location = findLocation(text) || state.location; const dateLabel = /내일/.test(text) ? "내일" : /어제/.test(text) ? "어제" : "오늘"; const rows = [];
      for (const line of text.split("\n")) {
        const normalized = line.replace(/\|/g,"\t").replace(/\*\*/g,"").trim(); const time = normalized.match(/(?:^|\s)(\d{1,2})시(?:\s|\t)/); const temp = normalized.match(/(-?\d+(?:\.\d+)?)\s*℃/); const percentages = [...normalized.matchAll(/(\d{1,3})\s*%/g)].map(m => Number(m[1])); const wind = normalized.match(/(\d+(?:\.\d+)?)\s*m\/s/i);
        if (!time || !temp || !percentages.length) continue; const hour = Number(time[1]); const condition = /눈/.test(normalized) ? "snow" : /소나기/.test(normalized) ? "shower" : /비|강수/.test(normalized) && !/강수없음/.test(normalized) ? "rain" : /맑/.test(normalized) ? "clear" : "cloudy";
        rows.push({ time: `${pad(hour)}:00`, temperature: Number(temp[1]), rainChance: percentages[0], humidity: percentages[1] ?? 60, wind: wind ? Number(wind[1]) : 0, condition });
      }
      return rows.length < 2 ? null : { location, dateLabel, dataType: /관측/.test(text) ? "observation" : "forecast", hours: rows };
    }
    function parseSingleObservation(text) {
      if (!/관측|기온/.test(text)) return null;
      const temperature = text.match(/(?:기온|현재\s*기온)\s*[:：]?\s*(-?\d+(?:\.\d+)?)\s*℃/); if (!temperature) return null;
      const timeMatch = text.match(/(?:오전|오후)?\s*(\d{1,2})(?::(\d{2}))?\s*시/) || text.match(/\b(\d{1,2}):(\d{2})\b/); const hour = timeMatch ? Number(timeMatch[1]) : new Date().getHours();
      const humidity = text.match(/습도\s*[:：]?\s*(\d{1,3}(?:\.\d+)?)\s*%/); const wind = text.match(/(?:풍속|바람)[^\d]{0,12}(\d+(?:\.\d+)?)\s*m\/s/i); const rain = text.match(/(?:강수량|시간강수량)\s*[:：]?\s*(-?\d+(?:\.\d+)?)\s*mm/i);
      const condition = /눈/.test(text) ? "snow" : /소나기/.test(text) ? "shower" : rain && Number(rain[1]) > 0 ? "rain" : /맑/.test(text) ? "clear" : "cloudy";
      return { location: findLocation(text) || state.location, dateLabel: "조회 시각", dataType: "observation", hours: [{ time: `${pad(hour)}:00`, temperature: Number(temperature[1]), humidity: humidity ? Number(humidity[1]) : 0, wind: wind ? Number(wind[1]) : 0, rainChance: rain && Number(rain[1]) > 0 ? 100 : 0, condition }] };
    }
    function applyStructuredWeather(data) {
      if (!Array.isArray(data.hours) || !data.hours.length) return false; state.location = data.location || state.location; state.dateLabel = data.dateLabel || "오늘"; state.dataType = data.dataType || "forecast";
      state.hours = data.hours.slice(0,24).map(h => ({ hour: Number(String(h.time).slice(0,2)), time: h.time, temperature: Number(h.temperature), humidity: Number(h.humidity ?? 60), wind: Number(h.wind ?? 0).toFixed(1), rainChance: Number(h.rainChance ?? 0), condition: h.condition || "cloudy", sourceType: h.sourceType || "forecast" }));
      state.selectedIndex = state.pendingHour === null ? 0 : state.hours.reduce((best,item,index) => Math.abs(item.hour-state.pendingHour) < Math.abs(state.hours[best].hour-state.pendingHour) ? index : best,0); state.pendingHour = null;
      $("#topLocation").textContent = state.location; $("#locationTitle").textContent = state.location; $("#dateLabel").textContent = state.dateLabel; $("#timeRange").max = state.hours.length - 1; $("#timelineShell").setAttribute("aria-valuemax", state.hours.length - 1); renderTimeline();
      state.weatherReady = true;
      setTimeout(completeLoading, 420); return true;
    }

    function normalizeFastWeather(data) {
      const hours = Array.isArray(data?.hours) ? data.hours.map(hour => ({ ...hour, sourceType: hour.sourceType || "forecast" })) : [];
      const current = data?.current;
      if (current?.time && Number.isFinite(Number(current.temperature))) {
        const currentRow = {
          time: current.time,
          temperature: Number(current.temperature),
          humidity: Number(current.humidity ?? 0),
          wind: Number(current.wind ?? 0),
          rainChance: Number(current.precipitation) > 0 ? 100 : 0,
          condition: current.condition || "cloudy",
          sourceType: current.sourceType || "observation"
        };
        const matchingIndex = hours.findIndex(hour => hour.time === currentRow.time);
        if (matchingIndex >= 0) hours[matchingIndex] = { ...hours[matchingIndex], ...currentRow, rainChance: hours[matchingIndex].rainChance ?? currentRow.rainChance };
        else hours.push(currentRow);
      }
      hours.sort((a, b) => String(a.time).localeCompare(String(b.time)));
      return { ...data, hours };
    }

    function readBrowserWeatherCache() {
      try {
        const cached = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || "null");
        if (!cached?.updatedAt || Date.now() - Date.parse(cached.updatedAt) > 2 * 60 * 60 * 1000) return null;
        return cached;
      } catch { return null; }
    }

    function showImmediateWeatherSummary(data) {
      const current = data?.current;
      if (!current || !Number.isFinite(Number(current.temperature))) return;
      const source = current.sourceType === "observation" ? "실제 관측" : "단기예보";
      const condition = names[current.condition] || "날씨 확인";
      showReply(`${data.location || "서울"} ${current.time} ${source} 기준 ${Number(current.temperature).toFixed(1)}℃, ${condition}입니다. 습도 ${Math.round(Number(current.humidity || 0))}%, 바람 ${Number(current.wind || 0).toFixed(1)}m/s입니다.`);
    }

    async function loadInitialWeather(forceFresh = false) {
      clearTimeout(state.loadingTimer);
      state.pendingHour = new Date().getHours();
      const cached = forceFresh ? null : readBrowserWeatherCache();
      if (cached) { applyStructuredWeather(normalizeFastWeather(cached)); showImmediateWeatherSummary(cached); }
      state.loadingTimer = setTimeout(() => {
        if (!state.weatherReady) showLoadingError("날씨 서버 응답이 평소보다 오래 걸리고 있습니다.");
      }, 12000);

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(`${WEATHER_ENDPOINT}?t=${Date.now()}`, { headers: { Accept: "application/json" }, cache: "no-store", signal: controller.signal });
        clearTimeout(timeout);
        if (!response.ok) throw new Error(`weather endpoint ${response.status}`);
        const weather = await response.json();
        if (!Array.isArray(weather.hours) || !weather.hours.length) throw new Error("weather rows missing");
        try { localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(weather)); } catch {}
        state.pendingHour = new Date().getHours();
        applyStructuredWeather(normalizeFastWeather(weather));
        showImmediateWeatherSummary(weather);
      } catch (error) {
        console.warn("빠른 날씨 조회 실패", error);
        if (!state.weatherReady) showLoadingError("기상청 날씨 정보를 가져오지 못했습니다.");
      }
    }

    function demoReply(text) {
      showReply("기상청 데이터를 불러오려면 에이전트 연결이 필요합니다. 잠시 후 페이지를 새로고침해 주세요.");
    }
    function findLocation(text) { return ["서울","부산","인천","수원","춘천","강릉","속초","청주","충주","대전","세종","전주","군산","광주","목포","여수","울산","대구","포항","안동","창원","진주","통영","제주","서귀포","해운대"].find(location => text.includes(location)); }
    function parseRequestedHour(text) { if (/저녁|퇴근/.test(text)) return 19; if (/점심/.test(text)) return 12; if (/아침|출근/.test(text)) return 8; const match = text.match(/(오전|오후)?\s*(\d{1,2})\s*시/); if (!match) return null; let hour = Number(match[2]); if (match[1] === "오후" && hour < 12) hour += 12; if (match[1] === "오전" && hour === 12) hour = 0; return hour; }
    function getUserId() { if (state.userId) return state.userId; let id = localStorage.getItem("weatherUserId"); if (!id || !id.startsWith("dl_")) { const unique = crypto.randomUUID ? crypto.randomUUID().replaceAll("-", "") : `${Date.now()}${Math.random().toString(16).slice(2)}`; id = `dl_${unique}`; localStorage.setItem("weatherUserId", id); } return id; }
    function showReply(text) { const box = $("#assistantReply"); box.textContent = text.replace(/```weather-ui[\s\S]*?```/gi,"").trim(); box.classList.add("show"); }
    function showToast(message) { const toast = $("#toast"); toast.textContent = message; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"),2200); }

    $("#assistantForm").addEventListener("submit", event => { event.preventDefault(); const input = $("#promptInput"); const text = input.value.trim(); if (!text) return; showReply(`“${text}” 확인 중…`); input.value = ""; sendPrompt(text); });
    $("#loaderRetry").addEventListener("click", retryInitialWeather);
    $("#locationButton").addEventListener("click", () => { setContext("서울","오늘","forecast"); loadInitialWeather(true); showToast("서울 · 현재 기상청 데이터를 다시 조회합니다"); });
    window.addEventListener("resize", () => selectHour(state.selectedIndex, false));
    window.addEventListener("pagehide", () => state.subscription?.unsubscribe?.());
    startLoaderAnimation(); bindLiquidDrag(); setContext("서울","오늘","forecast"); loadInitialWeather(); connectAgent();
  </script>
</body>
</html>
