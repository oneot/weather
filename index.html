  <title>Weather Agent</title>
  <style>
    :root {
      --ink: #0d2230;
      --ink-soft: rgba(13, 34, 48, .62);
      --white: #fff;
      --glass: rgba(255, 255, 255, .18);
      --glass-strong: rgba(255, 255, 255, .3);
      --glass-line: rgba(255, 255, 255, .68);
      --shadow: 0 28px 90px rgba(21, 46, 62, .18), 0 2px 8px rgba(21, 46, 62, .08);
      --lens-x: 0px;
      --count: 12;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
      background: #b9dded;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .scene-stack, .scene, .scene-shade { position: fixed; inset: 0; }
    .scene-stack { z-index: -4; overflow: hidden; background: #b9dded; }
    .scene {
      background-position: center;
      background-size: cover;
      opacity: 0;
      transform: scale(1.035);
      transition: opacity 1.15s ease, filter 1.15s ease, transform 8s ease;
    }
    .scene.active { opacity: 1; transform: scale(1); }

    body.night .scene { filter: brightness(.42) saturate(.76) hue-rotate(8deg); }
    .scene-shade {
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.08), transparent 38%, rgba(10,34,48,.12));
      transition: background .8s;
    }
    body.dark-ui { --ink: #f8fbff; --ink-soft: rgba(248,251,255,.68); }
    body.dark-ui .scene-shade { background: linear-gradient(180deg, rgba(2,12,22,.16), rgba(2,12,22,.05) 42%, rgba(2,12,22,.38));
      }

    .page { width: 100%;
      min-height: 100svh;
      margin: 0;
      padding: 24px 28px 30px;
      display: flex;
      flex-direction: column;
      }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 50px; }
    .place-button, .reset-button, .connection {
      border: 0; border-radius: 999px; padding: 10px 15px;
      background: rgba(255,255,255,.16); color: var(--ink); backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }
    .place-button, .reset-button { cursor: pointer; }
    .place-button { font-weight: 680; letter-spacing: -.02em; }
    .topbar { width: min(980px, 100%); margin-inline: auto; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .connection { display: flex; align-items: center; gap: 7px; color: var(--ink-soft); font-size: 12px; }
    .status-dot { width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f19e53;
      box-shadow: 0 0 0 4px rgba(241,158,83,.15);
      }
    .status-dot.online { background: #3db985; box-shadow: 0 0 0 4px rgba(61,185,133,.14); }

    main { flex: 1;
      width: 100%;
      align-self: stretch;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 0 20px;
      }
    .content-column { flex: 0 1 980px; width: min(980px, 100%); min-width: 0; margin: 0; }
    .weather-panel {
      width: 100%; border: 1px solid var(--glass-line); border-radius: 42px;
      background: linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.09));
      backdrop-filter: blur(30px) saturate(1.28); -webkit-backdrop-filter: blur(30px) saturate(1.28);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.76), inset 0 -1px 0 rgba(255,255,255,.2);
      padding: clamp(28px, 4.5vw, 54px); position: relative; overflow: hidden;
    }
    .weather-panel::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 15% 0%, rgba(255,255,255,.38), transparent 30%),
        linear-gradient(110deg, transparent 35%, rgba(255,255,255,.13) 48%, transparent 62%);
      mix-blend-mode: soft-light;
    }
    .summary { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: start; }
    .date-line { color: var(--ink-soft); font-size: 14px; letter-spacing: .015em; margin-bottom: 9px; }
    .location-line { font-size: clamp(26px, 4vw, 42px); font-weight: 710; letter-spacing: -.045em; margin: 0; }
    .temperature-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 12px; }
    .temperature { font-size: clamp(82px, 13vw, 148px); font-weight: 300; line-height: .84; letter-spacing: -.09em; }
    .degree-mark { font-size: clamp(34px, 5vw, 58px); font-weight: 300; margin-top: 2px; }
    .condition-block { text-align: right; padding-top: 8px; }
    .condition-icon { font-family: Georgia, serif;
      font-size: clamp(58px, 8vw, 88px);
      line-height: 1;
      font-weight: 300;
      text-shadow: 0 8px 28px rgba(255,255,255,.28);
      }
    .condition-name { font-size: 20px; font-weight: 650; margin-top: 7px; }
    .feels { color: var(--ink-soft); margin-top: 5px; font-size: 14px; }
    .hi-low { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .mini-pill { padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.26);
      font-size: 13px;
      }

    .divider { height: 1px;
      background: rgba(255,255,255,.42);
      margin: 34px 0 24px;
      box-shadow: 0 1px 0 rgba(13,34,48,.05);
      }
    .timeline-heading { display: flex; align-items: baseline; margin-bottom: 12px; position: relative; }
    .timeline-heading h2 { margin: 0; font-size: 15px; font-weight: 680; }
    .timeline-heading span { color: var(--ink-soft); font-size: 12px; }

    .timeline-viewport { overflow-x: auto; scrollbar-width: none; padding: 8px 1px 14px; position: relative; }
    .timeline-viewport::-webkit-scrollbar { display: none; }
    .timeline-shell {
      --item-w: 82px; position: relative; min-width: calc(var(--item-w) * var(--count)); height: 126px;
      border: 1px solid rgba(255,255,255,.4); border-radius: 31px;
      background: rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.38);
      touch-action: pan-y; user-select: none; cursor: grab; overflow: hidden;
    }
    .timeline-shell.dragging { cursor: grabbing; }
    .timeline-items { height: 100%;
      display: grid;
      grid-template-columns: repeat(var(--count), var(--item-w));
      align-items: stretch;
      }
    .hour-item {
      border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      gap: 7px; padding: 12px 4px; color: var(--ink-soft); cursor: pointer; position: relative; z-index: 1;
    }
    .hour-time { font-size: 11px; font-weight: 580; }
    .hour-icon { font-family: Georgia, serif; font-size: 26px; line-height: 1; }
    .hour-temp { color: var(--ink); font-size: 15px; font-weight: 680; }
    .hour-rain { font-size: 10px; opacity: .8; }

    .liquid-lens {
      position: absolute; left: 0; top: 7px; width: var(--item-w); height: 112px; z-index: 3; border-radius: 27px;
      transform: translate3d(var(--lens-x), 0, 0) skewX(var(--lens-tilt, 0deg)); transform-origin: center;
      background: linear-gradient(145deg, rgba(255,255,255,.42), rgba(255,255,255,.13) 56%, rgba(255,255,255,.25));
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 14px 30px rgba(30,57,72,.16), 0 2px 6px rgba(30,57,72,.08), inset 0 1px 1px rgba(255,
        255,255,.92), inset 0 -1px 1px rgba(255,255,255,.22);
      backdrop-filter: blur(16px) saturate(1.5) brightness(1.08);
        -webkit-backdrop-filter: blur(16px) saturate(1.5) brightness(1.08);
      pointer-events: none; transition: width .14s ease, border-radius .18s ease, box-shadow .18s ease;
      overflow: hidden;
    }
    .liquid-lens::before {
      content: ""; position: absolute; inset: 1px; border-radius: inherit;
      background: radial-gradient(circle at 27% 12%, rgba(255,255,255,.72), transparent 28%),
        linear-gradient(115deg, transparent 25%, rgba(255,255,255,.22) 48%, transparent 70%);
      opacity: .74; mix-blend-mode: soft-light;
    }
    .liquid-lens::after { content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 5px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      filter: blur(1px);
      }
    .timeline-shell.dragging .liquid-lens, .liquid-lens.gliding {
      transition: width .12s ease, border-radius .12s ease, box-shadow .12s ease;
      width: calc(var(--item-w) + var(--stretch, 0px)); border-radius: 32px;
      box-shadow: 0 22px 42px rgba(30,57,72,.22), inset 0 1px 2px rgba(255,255,255,.95), inset 0 -2px 3px rgba(255,255,255,.22);
    }
    .hour-item.is-selected { color: var(--ink); z-index: 4; text-shadow: 0 1px 8px rgba(255,255,255,.3); }
    .range-accessible { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .recommendations { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; position: relative; }
    .recommendation { padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      font-size: 12px;
      backdrop-filter: blur(8px);
      }
    .recommendation b { font-weight: 720; }

    .chat-panel {
      width: 100%; height: 64px; margin: 17px 0 0; display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid rgba(255,255,255,.64); border-radius: 32px;
      background: rgba(255,255,255,.25);
        backdrop-filter: blur(26px) saturate(1.3);
        -webkit-backdrop-filter: blur(26px) saturate(1.3);
      box-shadow: 0 18px 55px rgba(25,48,62,.14), inset 0 1px 0 rgba(255,255,255,.68); position: relative;
      transition: height .72s cubic-bezier(.2,.82,.22,1), border-radius .5s ease, background .5s ease;
    }
    .chat-panel.is-open { height: clamp(150px, 18vh, 190px); border-radius: 28px; background: rgba(255,255,255,.22); }
    .conversation-log {
      flex: 1; min-height: 0; display: none; flex-direction: column; gap: 9px; overflow-y: auto;
      padding: 17px 18px 8px; scroll-behavior: smooth; scrollbar-width: none;
    }
    .conversation-log::-webkit-scrollbar { display: none; }
    .chat-panel.is-open .conversation-log { display: flex; }
    .chat-message {
      width: fit-content; max-width: min(78%, 720px); padding: 9px 13px; border-radius: 17px;
      font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
      animation: messageIn .34s cubic-bezier(.2,.8,.2,1) both;
    }
    .chat-message.user { align-self: flex-start;
      color: var(--ink);
      background: rgba(255,255,255,.38);
      border: 1px solid rgba(255,255,255,.5);
      border-bottom-left-radius: 6px;
      }
    .chat-message.agent { align-self: flex-end;
      color: var(--ink);
      background: rgba(16,38,50,.12);
      border: 1px solid rgba(255,255,255,.24);
      border-bottom-right-radius: 6px;
      text-align: right;
      }
    @keyframes messageIn { from { opacity: 0;
      transform: translateY(7px) scale(.985);
      } to { opacity: 1;
      transform: none;
      } }
    .prompt-dock {
      width: 100%; margin: 0; display: grid; grid-template-columns: 1fr 46px; gap: 8px; align-items: center;
      padding: 8px; flex: 0 0 62px; position: relative;
    }
    .prompt-dock input { width: 100%;
      height: 44px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 0 15px;
      }
    .prompt-dock input::placeholder { color: var(--ink-soft); }
    .prompt-dock button { width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      cursor: pointer;
      box-shadow: inset 0 1px 0 white, 0 5px 14px rgba(30,57,72,.12);
      }
    .prompt-dock button:disabled { opacity: .45; cursor: wait; }
    .typing-indicator { min-height: 25px; display: inline-flex; align-items: center; gap: 6px; padding: 1px 2px; }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .42;
      animation: typingBounce 1.05s cubic-bezier(.45,.05,.55,.95) infinite;
      box-shadow: 0 2px 8px rgba(255,255,255,.16);
    }
    .typing-dot:nth-child(2) { animation-delay: .14s; }
    .typing-dot:nth-child(3) { animation-delay: .28s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0) scale(.86); opacity: .38; }
      30% { transform: translateY(-5px) scale(1.08); opacity: .9; }
    }
    .toast { position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      padding: 10px 15px;
      border-radius: 999px;
      background: rgba(12,29,40,.76);
      color: white;
      backdrop-filter: blur(16px);
      transition: .25s;
      font-size: 12px;
      }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 760px) {
      .page { padding: 14px 14px 20px; }
      .connection-label { display: none; }
      .reset-button { display: none; }
      main { padding-top: 15px; align-items: center; }
      .weather-panel { border-radius: 34px; padding: 28px 19px 23px; }
      .summary { gap: 12px; }
      .condition-name { font-size: 16px; }
      .hi-low { flex-direction: column; align-items: flex-end; }
      .mini-pill { padding: 6px 9px; }
      .divider { margin: 25px 0 19px; }
      .timeline-shell { --item-w: 74px; }
      .timeline-heading span { display: none; }
      .chat-panel, .prompt-dock { width: 100%; }
      .chat-panel.is-open { height: 170px; }
      .chat-message { max-width: 88%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important;
      transition-duration: .01ms !important;
      } }
  </style>

<body>
  <div class="scene-stack" aria-hidden="true">

    <div class="scene cloudy" data-scene="cloudy"></div>

    <div class="scene-shade"></div>
  </div>
  <div class="page">
    <header class="topbar">
      <button
        class="place-button"

    </header>

    <main>
      <div class="content-column">
        <section class="weather-panel" aria-labelledby="locationTitle">
          <div class="summary">
            <div>
              <div class="date-line"><span id="dateLabel">실시간 관측</span> · <span id="selectedTimeText">18:00</span></div>
              <h1 class="location-line" id="locationTitle">서울</h1>
              <div class="temperature-row"><span class="temperature" id="mainTemperature">--</span><span class="degree-mark">°</span></div>
            </div>
            <div class="condition-block">
              <div class="condition-icon" id="conditionIcon">···</div>

              <div class="feels">체감 <span id="feelsLike">--°</span></div>
              <div class="hi-low">
                <span class="mini-pill">
                  ↑ <span id="highTemp">--°</span>

                <span class="mini-pill">
                  ↓ <span id="lowTemp">--°</span>
                </span>
              </div>
            </div>
          </div>

          <div class="divider"></div>
          <div class="timeline-heading"><h2>타임라인</h2></div>
          <div class="timeline-viewport" id="timelineViewport">
            <div
              class="timeline-shell"
              id="timelineShell"
              role="slider"
              tabindex="0"
              aria-label="예보 시간"
              aria-valuemin="0"
              aria-valuemax="11"
              aria-valuenow="5"
            >
              <div class="timeline-items" id="timelineItems"></div>
              <div class="liquid-lens" id="liquidLens" aria-hidden="true"></div>
              <input class="range-accessible" id="timeRange" type="range" min="0" max="11" value="5">
            </div>
          </div>
          <div class="recommendations">
            <span class="recommendation">우산 <b id="umbrellaInsight">불필요</b></span>
            <span class="recommendation">습도 <b id="humidityInsight">60%</b></span>
            <span class="recommendation">바람 <b id="windInsight">1.8m/s</b></span>
          </div>
        </section>

        <section class="chat-panel" id="chatPanel" aria-label="날씨 에이전트 대화">
          <div class="conversation-log" id="conversationLog" role="log" aria-live="polite"></div>
          <form class="prompt-dock" id="assistantForm">
            <input
              id="promptInput"
              autocomplete="off"
              placeholder="날씨 관련 무엇이든 물어보세요 😎"
              aria-label="날씨 질문"
            >
            <button id="sendButton" type="submit" aria-label="질문 보내기">→</button>
          </form>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
  <script>
    /* Azure Function endpoints */
    const TOKEN_ENDPOINT = "https://weather-agent-joowon-c0gfe7d3ggfmf2f0.koreacentral-01.azurewebsites.net/api/directline-token";
    const WEATHER_ENDPOINT = "https://weather-agent-joowon-c0gfe7d3ggfmf2f0.koreacentral-01.azurewebsites.net/api/weather-now";
    const WEATHER_CACHE_KEY = "seoulWeatherCacheV1";

    const state = { location: "서울", dateLabel: "오늘", dataType: "forecast", selectedIndex: 0,
      connected: false, weatherReady: false, directLine: null, subscription: null, userId: null,
      pendingHour: null, loadingTimer: null, hours: [], lensX: 0, dragging: false };
    const $ = selector => document.querySelector(selector);
    const pad = n => String(n).padStart(2, "0");
    const symbols = { clear: "☀︎", cloudy: "☁︎", rain: "☂︎", shower: "☂︎", snow: "❄︎" };
    const names = { clear: "맑음", cloudy: "흐림", rain: "비", shower: "소나기", snow: "눈" };
    let lensMotionFrame = 0;

    function pendingWeather() {
      return Array.from({ length: 24 }, (_, i) => {
        const hour = i;
        return { hour, time: `${pad(hour)}:00`, temperature: null, humidity: null, wind: null,
          rainChance: null, condition: "cloudy", pending: true };
      });
    }

    function renderTimeline() {
      $("#timelineShell").style.setProperty("--count", state.hours.length);
      $("#timelineItems").innerHTML = state.hours.map((item, index) => `
        <button
          class="hour-item${
            index === state.selectedIndex ? " is-selected" : ""
          }"
          type="button"
          data-index="${index}"
          tabindex="-1"
          aria-label="${
            item.pending
              ? `${item.time}, 데이터 불러오는 중`
              : `${item.time}, ${item.temperature}도, 강수확률 ${
                  item.rainChance
                }%`
          }"
        >
          <span class="hour-time">${item.time}</span>
          <span class="hour-icon">
            ${item.pending ? "·" : symbols[item.condition]}
          </span>
          <span class="hour-temp">
            ${item.pending ? "--°" : `${item.temperature}°`}
          </span>
          <span class="hour-rain">
            ${item.pending ? "--%" : `${item.rainChance}%`}
          </span>
        </button>`).join("");
      $("#timelineItems").querySelectorAll(".hour-item").forEach(button => button.addEventListener("click",
        event => { event.stopPropagation();
        selectHour(Number(button.dataset.index));
        }));
      requestAnimationFrame(() => { moveLens(lensPositionFor(state.selectedIndex), true, 0);
        updateSelectedHourClass();
        renderSelectedWeather(false);
        });
    }

    function itemWidth() { return parseFloat(getComputedStyle($("#timelineShell")).getPropertyValue("--item-w")) || 82;
      }
    function maxLensX() { return Math.max(0, itemWidth() * (state.hours.length - 1)); }
    function lensPositionFor(index) { return Math.min(maxLensX(), Math.max(0, index * itemWidth())); }

    function moveLens(x, immediate = false, velocity = 0) {
      const shell = $("#timelineShell");
      const lens = $("#liquidLens");
      cancelAnimationFrame(lensMotionFrame);
      lens.classList.remove("gliding");
      state.lensX = Math.min(maxLensX(), Math.max(0, x));
      shell.style.setProperty("--lens-x", `${state.lensX}px`);
      shell.style.setProperty("--stretch", `${Math.min(15, Math.abs(velocity) * .16)}px`);
      shell.style.setProperty("--lens-tilt", `${Math.max(-5, Math.min(5, velocity * .08))}deg`);
      const index = Math.min(state.hours.length - 1, Math.max(0, Math.round(state.lensX / itemWidth())));
      if (index !== state.selectedIndex) { state.selectedIndex = index;
        updateSelectedHourClass();
        renderSelectedWeather(false);
        }
    }

    function updateSelectedHourClass() {
      $("#timelineItems").querySelectorAll(".hour-item").forEach((item, index) => item.classList.toggle("is-selected",
        index === state.selectedIndex));
    }

    function animateLensTo(x) {
      cancelAnimationFrame(lensMotionFrame);
      const shell = $("#timelineShell"); const lens = $("#liquidLens");
      const target = Math.min(maxLensX(), Math.max(0, x));
      let position = state.lensX; let velocity = 0;
      lens.classList.add("gliding");

      const step = () => {
        const distance = target - position;
        velocity = (velocity + distance * .105) * .76;
        position += velocity;
        const stretch = Math.min(20, Math.abs(velocity) * 1.25);
        state.lensX = position;
        shell.style.setProperty("--lens-x", `${position - stretch / 2}px`);
        shell.style.setProperty("--stretch", `${stretch}px`);
        shell.style.setProperty("--lens-tilt", `${Math.max(-5.5, Math.min(5.5, velocity * .18))}deg`);
        if (Math.abs(distance) < .12 && Math.abs(velocity) < .12) {
          state.lensX = target;
          shell.style.setProperty("--lens-x", `${target}px`);
          shell.style.setProperty("--stretch", "0px");
          shell.style.setProperty("--lens-tilt", "0deg");
          lens.classList.remove("gliding");
          return;
        }
        lensMotionFrame = requestAnimationFrame(step);
      };
      lensMotionFrame = requestAnimationFrame(step);
    }

    function selectHour(index, scroll = true) {
      state.selectedIndex = Math.max(0, Math.min(state.hours.length - 1, index));
      $("#timeRange").value = state.selectedIndex;
      $("#timelineShell").setAttribute("aria-valuenow", state.selectedIndex);
      updateSelectedHourClass();
      animateLensTo(lensPositionFor(state.selectedIndex));
      renderSelectedWeather(false);
      if (scroll) ensureSelectedVisible();
    }

    function ensureSelectedVisible() {
      const viewport = $("#timelineViewport");
      const center = lensPositionFor(state.selectedIndex) + itemWidth() / 2;
      viewport.scrollTo({ left: Math.max(0, center - viewport.clientWidth / 2), behavior: "smooth" });
    }

    function renderSelectedWeather(updateLens = true) {
      const item = state.hours[state.selectedIndex]; if (!item) return;
      $("#selectedTimeText").textContent = item.time;
      $("#dateLabel").textContent = "실시간 관측";
      if (item.pending) {
        $("#mainTemperature").textContent = "--";
          $("#conditionIcon").textContent = "···";
          $("#conditionName").textContent = "기상청 데이터 연결 중";
          $("#feelsLike").textContent = "--°";
        $("#highTemp").textContent = "--°";
          $("#lowTemp").textContent = "--°";
          $("#umbrellaInsight").textContent = "확인 중";
          $("#humidityInsight").textContent = "--%";
          $("#windInsight").textContent = "--m/s";
        $("#timelineShell").setAttribute("aria-valuetext", `${item.time}, 데이터 불러오는 중`); return;
      }
      $("#mainTemperature").textContent = Math.round(item.temperature);
      $("#conditionIcon").textContent = symbols[item.condition];
      $("#conditionName").textContent = names[item.condition];
      $("#feelsLike").textContent = `${Math.round(item.temperature - (Number(item.wind) >= 3 ? 2 : 1))}°`;
      const temps = state.hours.map(h => Number(h.temperature));
      $("#highTemp").textContent = `${Math.max(...temps)}°`; $("#lowTemp").textContent = `${Math.min(...temps)}°`;
      $("#umbrellaInsight").textContent = item.rainChance >= 50 ? "필요" : item.rainChance >= 30 ? "챙기면 안심" : "불필요";
      $("#humidityInsight").textContent = `${item.humidity}%`; $("#windInsight").textContent = `${item.wind}m/s`;
      $("#timelineShell").setAttribute("aria-valuetext", `${item.time}, ${item.temperature}도, ${names[item.condition]}`);
      syncScene(item);
    }

    function syncScene(item) {
      const sceneName =
        item.condition === "rain" || item.condition === "shower"
          ? "rainy"
          : item.condition === "cloudy" || item.condition === "snow"
            ? "cloudy"
            : "sunny";
      document.querySelectorAll(".scene").forEach(scene => scene.classList.toggle("active", scene.dataset.scene === sceneName));
      const night = item.hour >= 20 || item.hour < 6;
      document.body.classList.toggle("night", night);
        document.body.classList.toggle("dark-ui", night || sceneName === "rainy");
    }

    function bindLiquidDrag() {
      const shell = $("#timelineShell"); let startX = 0, lastX = 0, lastT = 0;
      const localX = event => event.clientX - shell.getBoundingClientRect().left - itemWidth() / 2;
      shell.addEventListener("pointerdown", event => {
        if (event.button !== undefined && event.button !== 0) return;
        state.dragging = true; shell.classList.add("dragging"); shell.setPointerCapture(event.pointerId);
        startX = lastX = event.clientX; lastT = performance.now(); moveLens(localX(event), true, 0);
      });
      shell.addEventListener("pointermove", event => {
        if (!state.dragging) return;
          const now = performance.now();
          const velocity = (event.clientX - lastX) / Math.max(1, now - lastT) * 16;
        moveLens(localX(event), true, velocity); lastX = event.clientX; lastT = now;
      });
      const end = event => {
        if (!state.dragging) return;
          state.dragging = false;
          shell.classList.remove("dragging");
          shell.style.setProperty("--stretch", "0px");
        try { shell.releasePointerCapture(event.pointerId); } catch {}
        selectHour(Math.round(state.lensX / itemWidth()));
      };
      shell.addEventListener("pointerup", end); shell.addEventListener("pointercancel", end);
      shell.addEventListener("keydown", event => {
        if (event.key === "ArrowRight") { event.preventDefault(); selectHour(state.selectedIndex + 1); }
        if (event.key === "ArrowLeft") { event.preventDefault(); selectHour(state.selectedIndex - 1); }
        if (event.key === "Home") { event.preventDefault(); selectHour(0); }
        if (event.key === "End") { event.preventDefault(); selectHour(state.hours.length - 1); }
      });
    }

    function setContext(location, dateLabel = "오늘", dataType = "forecast") {
      state.location = location || "서울";
        state.dateLabel = dateLabel;
        state.dataType = dataType;
        state.hours = pendingWeather();
        state.selectedIndex = dateLabel === "오늘" ? new Date().getHours() : 0;
      $("#topLocation").textContent = state.location;
        $("#locationTitle").textContent = state.location;
        $("#dateLabel").textContent = "실시간 관측";
      $("#timeRange").max = state.hours.length - 1;
        $("#timelineShell").setAttribute("aria-valuemax", state.hours.length - 1);
        renderTimeline();
    }

    async function connectAgent() {
      if (!TOKEN_ENDPOINT || TOKEN_ENDPOINT.includes("YOUR-")) { setConnection(false, "연결 설정 필요"); return; }
      setConnection(false, "Connecting");
      try {
        const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 12000);
        const response = await fetch(TOKEN_ENDPOINT, { method: "POST", headers: { "Accept": "application/json" },
          signal: controller.signal });
          clearTimeout(timeout);
        if (!response.ok) { const detail = await response.text();
          throw new Error(`token endpoint ${response.status}: ${detail.slice(0, 180)}`);
          }
        const payload = await response.json(); const token = payload.token || payload.directLineToken || payload;
        if (!token || typeof token !== "string") throw new Error("token missing");
        if (!payload.userId || !String(payload.userId).startsWith("dl_")) throw new Error("Direct Line userId missing");
        state.userId = payload.userId;
        state.subscription?.unsubscribe?.();
        state.directLine = window.WebChat.createDirectLine({ token });
        state.subscription = state.directLine.activity$.subscribe({
          next: activity => { const isBot = activity.from?.role === "bot" || (activity.from?.id && activity.from.id !== state.userId);
            if (activity.type === "message" && isBot) receiveAgentActivity(activity);
            },
          error: error => { console.warn("Direct Line stream error", error);
            setConnection(false, "Offline");
            $("#sendButton").disabled = false;
            }
        });
        setConnection(true, "Online");
      } catch (error) { console.warn("Direct Line 연결 실패", error); setConnection(false, "Offline"); }
    }
    function setConnection(online, label) { state.connected = online;
      $("#statusDot").classList.toggle("online", online);
      $("#connectionLabel").textContent = label;
      }
    function completeLoading() {
      clearTimeout(state.loadingTimer); state.loadingTimer = null;
    }
    function showLoadingError(message) {
      clearTimeout(state.loadingTimer); state.loadingTimer = null;
      showToast(message || "날씨 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
    }

    async function sendPrompt(text) {
      if (state.connected && state.directLine) {
        $("#sendButton").disabled = true;
        const requestedHour = parseRequestedHour(text); if (requestedHour !== null) state.pendingHour = requestedHour;
        try {
          await state.directLine.postActivity({ type: "message", from: { id: getUserId(),
            name: "날씨 사용자" }, text, locale: "ko-KR", channelData: { clientContext: { location: state.location,
            dateLabel: state.dateLabel, selectedTime: state.hours[state.selectedIndex]?.time } } }).toPromise();
        } catch (error) {
          console.warn("메시지 전송 실패", error);
            $("#sendButton").disabled = false;
            setConnection(false, "Offline");
            showReply("메시지를 보내지 못했습니다. 페이지를 새로고침해 다시 연결해 주세요.");
        }
      } else demoReply(text);
    }
    function receiveAgentActivity(activity) { $("#sendButton").disabled = false;
      const text = activity.text || extractAttachmentText(activity.attachments) || "응답을 받았습니다.";
      showReply(text);
      applyAgentContext(text, activity.channelData);
      }
    function extractAttachmentText(attachments = []) {
      return attachments
        .map(attachment =>
          attachment.content?.body
            ?.map?.(item => item.text)
            .filter(Boolean)
            .join(" ")
        )
        .filter(Boolean)
        .join("\n");
    }

    function applyAgentContext(text, channelData = {}) {
      const structured = channelData?.weatherUi || parseWeatherUiBlock(text);
        if (structured) return applyStructuredWeather(structured);
      const tableData = parseForecastTable(text); if (tableData) return applyStructuredWeather(tableData);
      const observation = parseSingleObservation(text); if (observation) return applyStructuredWeather(observation);
      // 답변에 지역명이 포함됐다는 이유만으로 화면을 바꾸지 않는다.
      // 전체 날씨 화면은 시간별 수치가 포함된 검증 가능한 데이터가 있을 때만 갱신한다.
      return false;
    }
    function parseWeatherUiBlock(text) { const match = text.match(/```weather-ui\s*([\s\S]*?)```/i);
      if (!match) return null;
      try { return JSON.parse(match[1]);
      } catch { return null;
      } }
    function parseForecastTable(text) {
      const location = findLocation(text) || state.location;
        const dateLabel = /내일/.test(text) ? "내일" : /어제/.test(text) ? "어제" : "오늘";
        const rows = [];
      for (const line of text.split("\n")) {
        const normalized = line.replace(/\|/g,"\t").replace(/\*\*/g,"").trim();
          const time = normalized.match(/(?:^|\s)(\d{1,2})시(?:\s|\t)/);
          const temp = normalized.match(/(-?\d+(?:\.\d+)?)\s*℃/);
          const percentages = [...normalized.matchAll(/(\d{1,3})\s*%/g)].map(m => Number(m[1]));
          const wind = normalized.match(/(\d+(?:\.\d+)?)\s*m\/s/i);
        if (!time || !temp || !percentages.length) continue;
          const hour = Number(time[1]);
          const condition = /눈/.test(normalized)
            ? "snow"
            : /소나기/.test(normalized)
              ? "shower"
              : /비|강수/.test(normalized) &&
                  !/강수없음/.test(normalized)
                ? "rain"
                : /맑/.test(normalized)
                  ? "clear"
                  : "cloudy";
        rows.push({ time: `${pad(hour)}:00`, temperature: Number(temp[1]), rainChance: percentages[0],
          humidity: percentages[1] ?? 60, wind: wind ? Number(wind[1]) : 0, condition });
      }
      return rows.length < 2 ? null : { location, dateLabel, dataType: /관측/.test(text) ? "observation" : "forecast", hours: rows };
    }
    function parseSingleObservation(text) {
      if (!/관측|기온/.test(text)) return null;
      const temperature = text.match(/(?:기온|현재\s*기온)\s*[:：]?\s*(-?\d+(?:\.\d+)?)\s*℃/); if (!temperature) return null;
      const timeMatch = text.match(/(?:오전|오후)?\s*(\d{1,2})(?::(\d{2}))?\s*시/) || text.match(/\b(\d{1,2}):(\d{2})\b/);
        const hour = timeMatch ? Number(timeMatch[1]) : new Date().getHours();
      const humidity = text.match(/습도\s*[:：]?\s*(\d{1,3}(?:\.\d+)?)\s*%/);
        const wind = text.match(/(?:풍속|바람)[^\d]{0,12}(\d+(?:\.\d+)?)\s*m\/s/i);
        const rain = text.match(/(?:강수량|시간강수량)\s*[:：]?\s*(-?\d+(?:\.\d+)?)\s*mm/i);
      const condition = /눈/.test(text)
        ? "snow"
        : /소나기/.test(text)
          ? "shower"
          : rain && Number(rain[1]) > 0
            ? "rain"
            : /맑/.test(text)
              ? "clear"
              : "cloudy";
      return { location: findLocation(text) || state.location, dateLabel: "조회 시각", dataType: "observation",
        hours: [{ time: `${pad(hour)}:00`, temperature: Number(temperature[1]), humidity: humidity ? Number(humidity[1]) : 0,
        wind: wind ? Number(wind[1]) : 0, rainChance: rain && Number(rain[1]) > 0 ? 100 : 0,
        condition }] };
    }
    function applyStructuredWeather(data) {
      if (!Array.isArray(data.hours) || !data.hours.length) return false;
        state.location = data.location || state.location;
        state.dateLabel = data.dateLabel || "오늘";
        state.dataType = data.dataType || "forecast";
      state.hours = data.hours.slice(0,24).map(h => ({ hour: Number(String(h.time).slice(0,
        2)), time: h.time, temperature: Number(h.temperature), humidity: Number(h.humidity ?? 60),
        wind: Number(h.wind ?? 0).toFixed(1), rainChance: Number(h.rainChance ?? 0), condition: h.condition || "cloudy",
        sourceType: h.sourceType || "forecast" }));
      state.selectedIndex = state.pendingHour === null ? 0 : state.hours.reduce((best,
        item,index) => Math.abs(item.hour-state.pendingHour) < Math.abs(state.hours[best].hour-state.pendingHour) ? index : best,
        0);
        state.pendingHour = null;
      $("#topLocation").textContent = state.location;
        $("#locationTitle").textContent = state.location;
        $("#dateLabel").textContent = "실시간 관측";
        $("#timeRange").max = state.hours.length - 1;
        $("#timelineShell").setAttribute("aria-valuemax", state.hours.length - 1);
        renderTimeline();
      state.weatherReady = true;
      setTimeout(completeLoading, 420); return true;
    }

    function normalizeFastWeather(data) {
      const hours = Array.isArray(data?.hours) ? data.hours.map(hour => ({ ...hour, sourceType: hour.sourceType || "forecast" })) : [];
      const current = data?.current;
      if (current?.time && Number.isFinite(Number(current.temperature))) {
        const currentRow = {
          time: current.time,
          temperature: Number(current.temperature),
          humidity: Number(current.humidity ?? 0),
          wind: Number(current.wind ?? 0),
          rainChance: Number(current.precipitation) > 0 ? 100 : 0,
          condition: current.condition || "cloudy",
          sourceType: current.sourceType || "observation"
        };
        const matchingIndex = hours.findIndex(hour => hour.time === currentRow.time);
        if (matchingIndex >= 0) hours[matchingIndex] = { ...hours[matchingIndex], ...currentRow,
          rainChance: hours[matchingIndex].rainChance ?? currentRow.rainChance };
        else hours.push(currentRow);
      }
      hours.sort((a, b) => String(a.time).localeCompare(String(b.time)));
      return { ...data, hours };
    }

    function readBrowserWeatherCache() {
      try {
        const cached = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || "null");
        if (!cached?.updatedAt || Date.now() - Date.parse(cached.updatedAt) > 2 * 60 * 60 * 1000) return null;
        return cached;
      } catch { return null; }
    }

    async function loadInitialWeather(forceFresh = false) {
      clearTimeout(state.loadingTimer);
      state.pendingHour = new Date().getHours();
      const cached = forceFresh ? null : readBrowserWeatherCache();
      if (cached) applyStructuredWeather(normalizeFastWeather(cached));
      state.loadingTimer = setTimeout(() => {
        if (!state.weatherReady) showLoadingError("날씨 서버 응답이 평소보다 오래 걸리고 있습니다.");
      }, 12000);

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(`${WEATHER_ENDPOINT}?t=${Date.now()}`, { headers: { Accept: "application/json" },
          cache: "no-store", signal: controller.signal });
        clearTimeout(timeout);
        if (!response.ok) throw new Error(`weather endpoint ${response.status}`);
        const weather = await response.json();
        if (!Array.isArray(weather.hours) || !weather.hours.length) throw new Error("weather rows missing");
        try { localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(weather)); } catch {}
        state.pendingHour = new Date().getHours();
        applyStructuredWeather(normalizeFastWeather(weather));
      } catch (error) {
        console.warn("빠른 날씨 조회 실패", error);
        if (!state.weatherReady) showLoadingError("기상청 날씨 정보를 가져오지 못했습니다.");
      }
    }

    function demoReply(text) {
      showReply(
        "기상청 데이터를 불러오려면 에이전트 연결이 필요합니다. " +
        "잠시 후 페이지를 새로고침해 주세요."
      );
    }
    function findLocation(text) {
      return [
        "서울", "부산", "인천", "수원", "춘천", "강릉", "속초",
        "청주", "충주", "대전", "세종", "전주", "군산", "광주",
        "목포", "여수", "울산", "대구", "포항", "안동", "창원",
        "진주", "통영", "제주", "서귀포", "해운대"
      ].find(location => text.includes(location));
    }
    function parseRequestedHour(text) { if (/저녁|퇴근/.test(text)) return 19;
      if (/점심/.test(text)) return 12;
      if (/아침|출근/.test(text)) return 8;
      const match = text.match(/(오전|오후)?\s*(\d{1,2})\s*시/);
      if (!match) return null;
      let hour = Number(match[2]);
      if (match[1] === "오후" && hour < 12) hour += 12;
      if (match[1] === "오전" && hour === 12) hour = 0;
      return hour;
      }
    function getUserId() { if (state.userId) return state.userId;
      let id = localStorage.getItem("weatherUserId");
      if (!id || !id.startsWith("dl_")) { const unique = crypto.randomUUID ? crypto.randomUUID().replaceAll("-",
        "") : `${Date.now()}${Math.random().toString(16).slice(2)}`;
      id = `dl_${unique}`;
      localStorage.setItem("weatherUserId", id);
      } return id;
      }
    function scrollConversation() { const log = $("#conversationLog");
      requestAnimationFrame(() => { log.scrollTop = log.scrollHeight;
      });
      }
    function appendMessage(role, text) { const message = document.createElement("div");
      message.className = `chat-message ${role}`;
      message.textContent = text;
      $("#conversationLog").appendChild(message);
      scrollConversation();
      return message;
      }
    function openChatPanel() { $("#chatPanel").classList.add("is-open"); }
    function showTypingIndicator() {
      openChatPanel();
      const message = document.createElement("div"); message.className = "chat-message agent typing-message";
      message.innerHTML = `
        <span
          class="typing-indicator"
          role="status"
          aria-label="에이전트가 답변을 작성하고 있습니다"
        >
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </span>
      `;
      $("#conversationLog").appendChild(message); scrollConversation();
    }
    function showReply(text) {
      openChatPanel();
      const cleaned = text.replace(/```weather-ui[\s\S]*?```/gi,"").replace(/\*\*/g, "").trim();
      const typing = $("#conversationLog .typing-message");
      if (typing) { typing.classList.remove("typing-message"); typing.textContent = cleaned; }
      else appendMessage("agent", cleaned);
      scrollConversation();
    }
    function showToast(message) { const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"),2200);
      }

    $("#assistantForm").addEventListener("submit", event => { event.preventDefault();
      const input = $("#promptInput");
      const text = input.value.trim();
      if (!text) return;
      input.placeholder = "";
      openChatPanel();
      appendMessage("user", text);
      showTypingIndicator();
      input.value = "";
      sendPrompt(text);
      });
    $("#locationButton").addEventListener("click", () => { setContext("서울","오늘","forecast");
      loadInitialWeather(true);
      showToast("서울 · 현재 기상청 데이터를 다시 조회합니다");
      });
    window.addEventListener("resize", () => selectHour(state.selectedIndex, false));
    window.addEventListener("pagehide", () => state.subscription?.unsubscribe?.());
    bindLiquidDrag(); setContext("서울","오늘","forecast"); loadInitialWeather(); connectAgent();
  </script>
</body>
</html>
